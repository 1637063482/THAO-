name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Test, typecheck, rules, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test -- --run --maxWorkers=2

      - name: Run typecheck
        run: npm run typecheck

      - name: Run JavaScript typecheck
        run: npm run typecheck:js

      - name: Run Firestore Rules tests
        run: npm run test:rules

      - name: Build production bundle
        run: npm run build
