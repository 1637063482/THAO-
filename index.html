<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="app_name">Sổ thu chi của Thao</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007aff">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sổ của Thao">
    <link rel="apple-touch-icon" href="/app-icon-192.png">
    <script type="module" src="/src/js/main.js"></script>
</head>
<body class="font-sans antialiased selection:bg-blue-200">

    <!-- Auth overlay -->
    <div id="auth-overlay" class="overlay-base overlay-auth" style="display:none;opacity:0;">
        <div class="auth-shell w-full max-w-sm mx-4 animate-slide-up">
            <div class="auth-brand flex flex-col items-center text-center">
                <div class="auth-app-icon" aria-hidden="true">
                    <span data-icon="wallet" data-icon-class="w-10 h-10 text-white"></span>
                </div>
                <h2 class="auth-title font-heading" data-i18n="app_name"></h2>
                <p class="auth-subtitle" data-i18n="app_subtitle"></p>
            </div>
            <form class="auth-form auth-card w-full" onsubmit="event.preventDefault();window.handleLogin()">
                <div class="auth-field-group" role="group" data-i18n-aria-label="login">
                    <div class="auth-field">
                        <label class="auth-field-label" for="auth-email" data-i18n="email"></label>
                        <input type="email" id="auth-email" class="auth-input" data-i18n-placeholder="email" autocomplete="email" autocapitalize="none" spellcheck="false" inputmode="email">
                    </div>
                    <div class="auth-field">
                        <label class="auth-field-label" for="auth-password" data-i18n="password"></label>
                        <input type="password" id="auth-password" class="auth-input" data-i18n-placeholder="password_placeholder" autocomplete="current-password">
                        <button type="button" id="auth-password-toggle" class="auth-password-toggle" role="switch" aria-checked="false" aria-pressed="false" data-i18n-aria-label="show_password">
                            <span data-icon="eye" data-icon-class="w-5 h-5"></span>
                        </button>
                    </div>
                </div>
                <div id="auth-error" role="alert" aria-live="assertive" class="auth-error hidden"></div>
                <button type="submit" class="btn-primary w-full auth-submit" data-i18n="login"></button>
                <p class="auth-hint" data-i18n="login_hint"></p>
            </form>
        </div>
        <div id="timeout-msg" role="alert" aria-live="assertive" class="timeout-msg" style="display:none;" data-i18n="timeout_message"></div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" role="status" aria-live="polite" class="overlay-base overlay-loading" style="display:flex;opacity:1;">
        <div class="text-center space-y-4 animate-slide-up">
            <div class="loading-spinner mx-auto"></div>
            <p class="text-slate-500 text-sm font-medium" data-i18n="loading_data"></p>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite" aria-atomic="true" style="opacity:0;">
        <span id="toast-icon"></span>
        <span id="toast-msg"></span>
    </div>

    <!-- Nav bar -->
    <header data-app-header-host></header>

    <!-- App Shell: sidebar + main -->
    <div class="flex flex-col md:flex-row max-w-[2200px] mx-auto">
        <!-- Sidebar (desktop) -->
        <aside id="sidebar" data-app-sidebar-host></aside>

        <main class="flex-1 min-w-0 px-4 md:px-6 py-6 pb-24 md:pb-6">
            <!-- Global overlays (outside view containers so they work on any tab) -->
            <div id="deposit-form-root" data-deposit-form-host></div>
            <div id="deposit-reminder-root"></div>

            <!-- Overview content -->
            <div id="overview-content" class="space-y-5">
                <!-- Dashboard -->
                <div id="dashboard-root"></div>

                <!-- Streak panel -->
                <div id="streak-panel"></div>

                <!-- Year-start balances -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center gap-2 mb-4">
                        <span data-icon="bank" data-icon-class="w-5 h-5 text-blue-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" id="ui-year-start-label" data-i18n="year_start_assets"></h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center">
                            <label for="bal-bank" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5">
                                <span data-icon="creditCard" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="bank_card"></span>
                            </label>
                            <input type="text" id="bal-bank" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label for="bal-alipay" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5">
                                <span class="app-icon-alipay align-middle mr-1">支</span><span data-i18n="alipay"></span>
                            </label>
                            <input type="text" id="bal-alipay" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label for="bal-wechat" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5">
                                <span class="app-icon-wechat align-middle mr-1">微</span><span data-i18n="wechat"></span>
                            </label>
                            <input type="text" id="bal-wechat" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label for="bal-other" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5">
                                <span data-icon="wallet" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="cash_other"></span>
                            </label>
                            <input type="text" id="bal-other" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- Month tabs -->
                <div class="flex flex-wrap gap-1.5 justify-center" id="month-tabs"></div>

                <div class="ledger-view-toggle flex justify-end gap-2" role="group" aria-label="Chế độ xem / 视图">
                    <button type="button" id="btn-toggle-ledger" class="month-tab" onclick="window.toggleLedgerView()"></button>
                </div>

                <div id="daily-ledger-container"></div>

                <!-- Monthly table container -->
                <div id="months-container" class="relative fade-in"></div>

                <!-- Year-end balances -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <span data-icon="checkCircle" data-icon-class="w-5 h-5 text-emerald-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" id="ui-year-end-label" data-i18n="year_end_assets"></h2>
                        <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold whitespace-nowrap" data-i18n="double_verify"></span>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center"><label for="end-bal-bank" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5"><span data-icon="creditCard" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="year_end_bank"></span></label><input type="text" id="end-bal-bank" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label for="end-bal-alipay" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5"><span class="app-icon-alipay align-middle mr-1">支</span><span data-i18n="year_end_alipay"></span></label><input type="text" id="end-bal-alipay" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label for="end-bal-wechat" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5"><span class="app-icon-wechat align-middle mr-1">微</span><span data-i18n="year_end_wechat"></span></label><input type="text" id="end-bal-wechat" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label for="end-bal-other" class="asset-label block text-sm font-semibold text-slate-600 mb-1.5"><span data-icon="wallet" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="year_end_cash"></span></label><input type="text" id="end-bal-other" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                    </div>
                </div>

                <!-- Asset reconciliation -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <span data-icon="wallet" data-icon-class="w-5 h-5 text-indigo-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" data-i18n="asset_reconciliation"></h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="initial_assets"></label>
                            <span class="text-xl font-bold text-slate-700 blur-sensitive" id="global-initial-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="theoretical_balance"></label>
                            <span class="text-xl font-bold text-slate-700 blur-sensitive" id="global-current-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="actual_balance"></label>
                            <span class="text-xl font-bold text-blue-600 blur-sensitive" id="global-actual-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="reconciliation_diff"></label>
                            <span class="text-xl font-bold blur-sensitive" id="global-recon-diff">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Savings view (hidden by default) -->
            <div id="savings-view" class="space-y-5" style="display:none">
                <div id="savings-root"></div>
                <div id="deposit-root"></div>
            </div>

            <!-- Analysis view (hidden by default) -->
            <div id="analysis-view" class="space-y-5" style="display:none">
                <!-- Yearly analysis -->
                <div class="card overflow-hidden animate-slide-up">
                    <div class="bg-blue-600 px-5 py-4">
                        <h2 class="text-lg font-bold text-white font-heading flex items-center gap-2">
                            <span data-icon="chartBar" data-icon-class="w-5 h-5"></span><span data-i18n="yearly_analysis"></span>
                        </h2>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="stat-card"><span class="stat-label" data-i18n="yearly_income"></span><span class="stat-value income blur-sensitive" id="global-income">0</span></div>
                        <div class="stat-card"><span class="stat-label" data-i18n="yearly_expense"></span><span class="stat-value expense blur-sensitive" id="global-expense">0</span></div>
                        <div class="stat-card border-t border-slate-100 pt-3"><span class="stat-label" data-i18n="system_balance"></span><span class="stat-value balance blur-sensitive" id="global-balance">0</span></div>
                        <div class="pt-3 border-t border-slate-100">
                            <div style="position:relative;width:100%;min-height:240px;"><canvas id="yearlyChart"></canvas></div>
                            <div id="yearly-legend" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Monthly analysis -->
                <div class="card overflow-hidden animate-slide-up">
                    <div class="bg-[var(--color-accent)] px-5 py-4">
                        <h2 class="text-lg font-bold text-white font-heading flex items-center gap-2">
                            <span data-icon="chartBar" data-icon-class="w-5 h-5"></span><span id="monthly-chart-title" data-i18n="monthly"></span>
                        </h2>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="stat-card"><span class="stat-label" data-i18n="monthly_income"></span><span class="stat-value income blur-sensitive" id="sidebar-monthly-inc">0</span></div>
                        <div class="stat-card"><span class="stat-label" data-i18n="monthly_expense"></span><span class="stat-value expense blur-sensitive" id="sidebar-monthly-exp">0</span></div>
                        <div class="stat-card border-t border-slate-100 pt-3"><span class="stat-label" data-i18n="monthly_balance"></span><span class="stat-value balance blur-sensitive" id="sidebar-monthly-bal">0</span></div>
                        <div class="pt-3 border-t border-slate-100">
                            <div style="position:relative;width:100%;min-height:240px;"><canvas id="monthlyChart"></canvas></div>
                            <div id="monthly-legend" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- FAB button -->
    <button id="fab-btn" onclick="window.openQuickAdd()" title="" data-i18n="quick_add">
        <span data-icon="plus" data-icon-class="w-7 h-7"></span>
    </button>

    <!-- Quick-add modal -->
    <div id="quick-add-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="quick-add-title" style="display:none;opacity:0;">
        <div id="quick-add-panel" class="p-6 w-full max-w-md mx-4">
            <div class="flex items-center justify-between mb-5">
                <h3 id="quick-add-title" class="text-lg font-black text-slate-800 font-heading">
                    <span data-icon="zap" data-icon-class="w-5 h-5 inline mr-1 text-blue-500"></span><span data-i18n="quick_add_title"></span>
                </h3>
                <button onclick="window.closeQuickAdd()" class="w-8 h-8 app-icon-btn" data-i18n-aria-label="close">
                    <span data-icon="xMark" data-icon-class="w-4 h-4"></span>
                </button>
            </div>
            <div class="space-y-4">
                <div class="flex gap-3">
                    <div class="flex-1 min-w-0"><label id="qa-day-label" class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="calendar" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="date"></span></label><span class="app-dropdown w-full" id="qa-day" data-app-dropdown><button type="button" class="app-dropdown-trigger" data-app-dropdown-trigger role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="qa-day-menu" aria-labelledby="qa-day-label"><span class="app-dropdown-value" data-app-dropdown-value></span><span class="app-dropdown-chevron" aria-hidden="true"><svg class="app-dropdown-chevron-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></span></button><div id="qa-day-menu" class="app-dropdown-menu" data-app-dropdown-menu role="listbox" hidden></div><input type="hidden" data-app-dropdown-hidden></span></div>
                    <div class="flex-1 min-w-0"><label id="qa-cat-label" class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="tag" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="category"></span></label><span class="app-dropdown w-full" id="qa-cat" data-app-dropdown><button type="button" class="app-dropdown-trigger" data-app-dropdown-trigger role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="qa-cat-menu" aria-labelledby="qa-cat-label"><span class="app-dropdown-value" data-app-dropdown-value></span><span class="app-dropdown-chevron" aria-hidden="true"><svg class="app-dropdown-chevron-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></span></button><div id="qa-cat-menu" class="app-dropdown-menu" data-app-dropdown-menu role="listbox" hidden></div><input type="hidden" data-app-dropdown-hidden></span></div>
                </div>
                <div><label for="qa-amount" class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="wallet" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="amount"></span></label><input type="number" id="qa-amount" class="app-form-control w-full text-lg font-bold" placeholder="" data-i18n="amount_placeholder" onkeydown="if(event.key==='Enter')window.submitQuickAdd()" inputmode="decimal"></div>
                <div><label for="qa-remark" class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="pencil" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="remark_optional"></span></label><input type="text" id="qa-remark" class="app-form-control w-full" placeholder="" onkeydown="if(event.key==='Enter')window.submitQuickAdd()"></div>
                <button onclick="window.submitQuickAdd()" class="btn-primary w-full py-3 text-base" data-i18n="confirm" data-quick-add-submit></button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav id="bottom-nav" class="md:hidden" data-app-bottom-nav-host></nav>

    <!-- Update toast -->
    <div id="update-toast" class="update-toast" role="status" aria-live="polite" aria-atomic="true">
        <div class="update-toast-body">
            <span data-icon="info" data-icon-class="w-6 h-6 text-[var(--color-primary)]"></span>
            <div class="update-toast-content">
                <p class="update-toast-title" data-i18n="update_available"></p>
                <p id="update-log" class="update-toast-log" data-i18n-aria-label=""></p>
                <button id="btn-update-refresh" class="mt-2 btn-primary text-xs py-1.5 px-3" data-i18n="update_now"></button>
            </div>
        </div>
    </div>

    <script>
      // Service Worker registration with explicit user-controlled activation.
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        var reloadingForServiceWorker = false;
        function showAvailableUpdate() {
          var toast = document.getElementById('update-toast');
          if (toast) { toast.style.display = 'block'; toast.style.transform = 'translateY(16px)'; }
        }
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          window.location.reload();
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            if (reg.waiting && navigator.serviceWorker.controller) showAvailableUpdate();
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    showAvailableUpdate();
                  }
                });
              }
            });
          }).catch(function(err) { console.log('SW skipped:', err); });
        });
      }
      document.getElementById('btn-update-refresh')?.addEventListener('click', function() {
        navigator.serviceWorker.getRegistration().then(function(registration) {
          if (registration && registration.waiting) registration.waiting.postMessage({ action: 'skipWaiting' });
        });
      });
    </script>
</body>
</html>
