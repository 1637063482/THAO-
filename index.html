<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="app_name">Sổ thu chi của Thao</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d97706">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sổ của Thao">
    <link rel="apple-touch-icon" href="/app-icon-192.png">
    <script type="module" src="/src/js/main.js"></script>
</head>
<body class="font-sans antialiased selection:bg-amber-200">

    <!-- Auth overlay -->
    <div id="auth-overlay" class="overlay-base overlay-auth" style="display:none;opacity:0;">
        <div class="w-full max-w-md mx-4">
            <div class="card p-8 text-center space-y-6 animate-slide-up">
                <span data-icon="wallet" data-icon-class="w-16 h-16 text-amber-500"></span>
                <div>
                    <h2 class="text-2xl font-black text-slate-800 font-heading" data-i18n="app_name"></h2>
                    <p class="text-slate-500 mt-2 text-sm" data-i18n="app_subtitle"></p>
                </div>
                <form onsubmit="event.preventDefault();window.handleLogin()">
                <div class="space-y-3 text-left">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">
                            <span data-icon="user" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="email"></span>
                        </label>
                        <input type="email" id="auth-email" class="input-glass" placeholder="" autocomplete="email">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">
                            <span data-icon="lock" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="password"></span>
                        </label>
                        <input type="password" id="auth-password" class="input-glass" placeholder="" autocomplete="current-password">
                    </div>
                    <div id="auth-error" role="alert" aria-live="assertive" class="hidden text-red-500 text-xs bg-red-50 rounded-lg px-3 py-2"></div>
                </div>
                <div class="flex flex-col gap-2">
                    <button type="submit" class="btn-primary w-full text-base py-3" data-i18n="login"></button>
                    <p class="text-center text-xs text-slate-400" data-i18n="login_hint"></p>
                </div>
                </form>
            </div>
        </div>
        <div id="timeout-msg" role="alert" aria-live="assertive" class="timeout-msg" style="display:none;" data-i18n="timeout_message"></div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" role="status" aria-live="polite" class="overlay-base overlay-loading" style="display:flex;opacity:1;">
        <div class="text-center space-y-4 animate-slide-up">
            <div class="loading-spinner mx-auto"></div>
            <p class="text-slate-500 text-sm font-medium" data-i18n="loading_data"></p>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite" aria-atomic="true" style="opacity:0;">
        <span id="toast-icon"></span>
        <span id="toast-msg"></span>
    </div>

    <!-- Nav bar -->
    <header data-app-header-host></header>

    <!-- App Shell: sidebar + main -->
    <div class="flex flex-col md:flex-row max-w-[2200px] mx-auto">
        <!-- Sidebar (desktop) -->
        <aside id="sidebar" data-app-sidebar-host></aside>

        <main class="flex-1 min-w-0 px-4 md:px-6 py-6 pb-24 md:pb-6">
            <!-- Global overlays (outside view containers so they work on any tab) -->
            <div id="deposit-form-root" data-deposit-form-host></div>
            <div id="deposit-reminder-root"></div>

            <!-- Overview content -->
            <div id="overview-content" class="space-y-5">
                <!-- Dashboard -->
                <div id="dashboard-root"></div>

                <!-- Streak panel -->
                <div id="streak-panel"></div>

                <!-- Year-start balances -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center gap-2 mb-4">
                        <span data-icon="bank" data-icon-class="w-5 h-5 text-amber-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" id="ui-year-start-label" data-i18n="year_start_assets"></h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                                <span data-icon="creditCard" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="bank_card"></span>
                            </label>
                            <input type="text" id="bal-bank" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                                <span class="app-icon-alipay align-middle mr-1">支</span><span data-i18n="alipay"></span>
                            </label>
                            <input type="text" id="bal-alipay" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                                <span class="app-icon-wechat align-middle mr-1">微</span><span data-i18n="wechat"></span>
                            </label>
                            <input type="text" id="bal-wechat" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-600 mb-1.5">
                                <span data-icon="wallet" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="cash_other"></span>
                            </label>
                            <input type="text" id="bal-other" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- Month tabs -->
                <div class="flex flex-wrap gap-1.5 justify-center" id="month-tabs"></div>

                <div class="ledger-view-toggle flex justify-end gap-2" role="group" aria-label="Chế độ xem / 视图">
                    <button type="button" id="btn-toggle-ledger" class="month-tab" onclick="window.toggleLedgerView()"></button>
                </div>

                <div id="daily-ledger-container"></div>

                <!-- Monthly table container -->
                <div id="months-container" class="relative fade-in"></div>

                <!-- Year-end balances -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <span data-icon="checkCircle" data-icon-class="w-5 h-5 text-emerald-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" id="ui-year-end-label" data-i18n="year_end_assets"></h2>
                        <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-semibold" data-i18n="double_verify"></span>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center"><label class="block text-sm font-semibold text-slate-600 mb-1.5"><span data-icon="creditCard" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="year_end_bank"></span></label><input type="text" id="end-bal-bank" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label class="block text-sm font-semibold text-slate-600 mb-1.5"><span class="app-icon-alipay align-middle mr-1">支</span><span data-i18n="year_end_alipay"></span></label><input type="text" id="end-bal-alipay" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label class="block text-sm font-semibold text-slate-600 mb-1.5"><span class="app-icon-wechat align-middle mr-1">微</span><span data-i18n="year_end_wechat"></span></label><input type="text" id="end-bal-wechat" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                        <div class="text-center"><label class="block text-sm font-semibold text-slate-600 mb-1.5"><span data-icon="wallet" data-icon-class="w-4 h-4 inline mr-1"></span><span data-i18n="year_end_cash"></span></label><input type="text" id="end-bal-other" data-type="balance" class="math-input input-glass text-xl font-bold text-slate-800" placeholder="0"></div>
                    </div>
                </div>

                <!-- Asset reconciliation -->
                <div class="card p-4 animate-slide-up">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <span data-icon="wallet" data-icon-class="w-5 h-5 text-indigo-500"></span>
                        <h2 class="text-lg font-bold text-slate-800 font-heading" data-i18n="asset_reconciliation"></h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="initial_assets"></label>
                            <span class="text-xl font-bold text-slate-700 blur-sensitive" id="global-initial-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="theoretical_balance"></label>
                            <span class="text-xl font-bold text-slate-700 blur-sensitive" id="global-current-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="actual_balance"></label>
                            <span class="text-xl font-bold text-amber-600 blur-sensitive" id="global-actual-assets">0</span>
                        </div>
                        <div class="text-center">
                            <label class="block text-sm font-semibold text-slate-500 mb-1.5" data-i18n="reconciliation_diff"></label>
                            <span class="text-xl font-bold blur-sensitive" id="global-recon-diff">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Savings view (hidden by default) -->
            <div id="savings-view" class="space-y-5" style="display:none">
                <div id="savings-root"></div>
                <div id="deposit-root"></div>
            </div>

            <!-- Analysis view (hidden by default) -->
            <div id="analysis-view" class="space-y-5" style="display:none">
                <!-- Yearly analysis -->
                <div class="card overflow-hidden animate-slide-up">
                    <div class="bg-gradient-to-r from-amber-500 to-amber-600 px-5 py-4">
                        <h2 class="text-lg font-bold text-white font-heading flex items-center gap-2">
                            <span data-icon="chartBar" data-icon-class="w-5 h-5"></span><span data-i18n="yearly_analysis"></span>
                        </h2>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="stat-card"><span class="stat-label" data-i18n="yearly_income"></span><span class="stat-value income blur-sensitive" id="global-income">0</span></div>
                        <div class="stat-card"><span class="stat-label" data-i18n="yearly_expense"></span><span class="stat-value expense blur-sensitive" id="global-expense">0</span></div>
                        <div class="stat-card border-t border-slate-100 pt-3"><span class="stat-label" data-i18n="system_balance"></span><span class="stat-value balance blur-sensitive" id="global-balance">0</span></div>
                        <div class="pt-3 border-t border-slate-100">
                            <div style="position:relative;width:100%;min-height:240px;"><canvas id="yearlyChart"></canvas></div>
                            <div id="yearly-legend" class="mt-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Monthly analysis -->
                <div class="card overflow-hidden animate-slide-up">
                    <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 px-5 py-4">
                        <h2 class="text-lg font-bold text-white font-heading flex items-center gap-2">
                            <span data-icon="chartBar" data-icon-class="w-5 h-5"></span><span id="monthly-chart-title" data-i18n="monthly"></span>
                        </h2>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="stat-card"><span class="stat-label" data-i18n="monthly_income"></span><span class="stat-value income blur-sensitive" id="sidebar-monthly-inc">0</span></div>
                        <div class="stat-card"><span class="stat-label" data-i18n="monthly_expense"></span><span class="stat-value expense blur-sensitive" id="sidebar-monthly-exp">0</span></div>
                        <div class="stat-card border-t border-slate-100 pt-3"><span class="stat-label" data-i18n="monthly_balance"></span><span class="stat-value balance blur-sensitive" id="sidebar-monthly-bal">0</span></div>
                        <div class="pt-3 border-t border-slate-100">
                            <div style="position:relative;width:100%;min-height:240px;"><canvas id="monthlyChart"></canvas></div>
                            <div id="monthly-legend" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- FAB button -->
    <button id="fab-btn" onclick="window.openQuickAdd()" title="" data-i18n="quick_add">
        <span data-icon="plus" data-icon-class="w-7 h-7"></span>
    </button>

    <!-- Quick-add modal -->
    <div id="quick-add-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="quick-add-title" style="display:none;opacity:0;">
        <div id="quick-add-panel" class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md mx-4 scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between mb-5">
                <h3 id="quick-add-title" class="text-lg font-black text-slate-800 font-heading">
                    <span data-icon="zap" data-icon-class="w-5 h-5 inline mr-1 text-amber-500"></span><span data-i18n="quick_add_title"></span>
                </h3>
                <button onclick="window.closeQuickAdd()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition-colors" data-i18n-aria-label="close">
                    <span data-icon="xMark" data-icon-class="w-4 h-4 text-slate-500"></span>
                </button>
            </div>
            <div class="space-y-4">
                <div class="grid gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="calendar" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="date"></span></label>
                        <div class="flex items-center gap-1.5">
                            <input type="hidden" id="qa-day" value="">
                            <div id="qa-day-chips" class="flex gap-1 flex-1 min-w-0" role="group" data-i18n-aria-label="date"></div>
                            <input type="date" id="qa-date-picker" class="input-glass flex-none !w-[132px]" data-i18n-aria-label="date">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="tag" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="category"></span></label>
                        <select id="qa-cat" class="w-full input-glass"></select>
                    </div>
                </div>
                <div><label class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="wallet" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="amount"></span></label><input type="number" id="qa-amount" class="w-full input-glass text-lg font-bold" placeholder="" data-i18n="amount_placeholder" onkeydown="if(event.key==='Enter')window.submitQuickAdd()" inputmode="decimal"></div>
                <div><label class="block text-xs font-semibold text-slate-500 mb-1"><span data-icon="pencil" data-icon-class="w-3.5 h-3.5 inline mr-1"></span><span data-i18n="remark_optional"></span></label><input type="text" id="qa-remark" class="w-full input-glass" placeholder="" onkeydown="if(event.key==='Enter')window.submitQuickAdd()"></div>
                <button onclick="window.submitQuickAdd()" class="btn-primary w-full py-3 text-base" data-i18n="confirm" data-quick-add-submit></button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav id="bottom-nav" class="md:hidden" data-app-bottom-nav-host></nav>

    <!-- Update toast -->
    <div id="update-toast" role="status" aria-live="polite" aria-atomic="true" style="position:fixed;top:env(safe-area-inset-top, 0);right:16px;z-index:400;display:none;background:rgba(255,255,255,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.08);padding:16px;max-width:360px;transform:translateY(-120%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);">
        <div style="display:flex;align-items:flex-start;gap:12px;">
            <span data-icon="info" data-icon-class="w-6 h-6 text-amber-500"></span>
            <div style="flex:1;">
                <p style="font-size:14px;font-weight:700;color:#1d1d1f;margin:0;" data-i18n="update_available"></p>
                <p id="update-log" style="display:none;font-size:12px;color:#6e6e73;margin-top:4px;white-space:pre-line;"></p>
                <button id="btn-update-refresh" class="mt-2 btn-primary text-xs py-1.5 px-3" data-i18n="update_now"></button>
            </div>
        </div>
    </div>

    <script>
      // Service Worker registration with explicit user-controlled activation.
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        var reloadingForServiceWorker = false;
        function showAvailableUpdate() {
          var toast = document.getElementById('update-toast');
          if (toast) { toast.style.display = 'block'; toast.style.transform = 'translateY(16px)'; }
        }
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (reloadingForServiceWorker) return;
          reloadingForServiceWorker = true;
          window.location.reload();
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            if (reg.waiting && navigator.serviceWorker.controller) showAvailableUpdate();
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    showAvailableUpdate();
                  }
                });
              }
            });
          }).catch(function(err) { console.log('SW skipped:', err); });
        });
      }
      document.getElementById('btn-update-refresh')?.addEventListener('click', function() {
        navigator.serviceWorker.getRegistration().then(function(registration) {
          if (registration && registration.waiting) registration.waiting.postMessage({ action: 'skipWaiting' });
        });
      });
    </script>
</body>
</html>
